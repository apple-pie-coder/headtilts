$kind: http-request
name: Set Menu Items
method: PUT
url: '{{baseUrl}}/api/menus/{{menuId}}/items'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "title": "Home",
          "url": "/",
          "position": 0
        }
      ]
    }
