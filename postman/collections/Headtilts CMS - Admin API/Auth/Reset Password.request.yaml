$kind: http-request
name: Reset Password
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
order: 6000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "password": "newpassword123"
    }
