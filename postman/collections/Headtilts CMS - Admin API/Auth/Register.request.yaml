$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "username": "newuser",
      "password": "password123",
      "firstName": "First",
      "lastName": "Last"
    }
