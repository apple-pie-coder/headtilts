packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
# Transitive packages with security fixes their parents don't pull in yet
# (razorpay → axios, express → qs, socket.io → ws).
overrides:
  'axios@<1.20.0': ^1.20.0
  'qs@<6.16.0': ^6.16.0
  'ws@>=8.0.0 <8.21.0': ^8.21.0
