worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        # Docker's internal DNS resolver.
        # Using variables in proxy_pass forces per-request DNS lookup so
        # nginx can start (and keep running) while the API container is
        # still booting or running migrations.
        resolver 127.0.0.11 valid=10s ipv6=off;

        client_max_body_size 50m;

        # Backup uploads can be very large — override the global limit for that endpoint
        location = /api/backups/upload {
            set $upstream http://api:3000;
            client_max_body_size 2g;
            proxy_pass              $upstream;
            proxy_http_version      1.1;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            proxy_request_buffering off;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        # API
        location /api/ {
            set $upstream http://api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Socket.IO - must come before the /api/ block is irrelevant but must
        # have WebSocket upgrade headers; nginx strips Upgrade by default.
        location /socket.io/ {
            set $upstream http://api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Uploaded media
        location /uploads/ {
            set $upstream http://api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Crawler files served by the API
        location = /robots.txt {
            set $upstream http://api:3000;
            proxy_pass       $upstream;
            proxy_set_header Host $host;
        }

        location = /sitemap.xml {
            set $upstream http://api:3000;
            proxy_pass       $upstream;
            proxy_set_header Host $host;
        }

        # Admin SPA
        # Redirect bare /admin so the SPA loads with a trailing slash.
        # Use $http_host (not $host) to preserve the port the browser used --
        # nginx listens on 80 internally but may be exposed on a different port.
        location = /admin {
            return 301 $scheme://$http_host/admin/;
        }

        # Strip the /admin/ prefix before forwarding to the admin container.
        # The inner nginx has try_files -> /index.html for SPA routing.
        location /admin/ {
            set $admin http://admin:80;
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass         $admin;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Public website (catch-all)
        # The inner nginx has try_files -> /index.html for SPA routing.
        location / {
            set $web http://web:80;
            proxy_pass         $web;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
