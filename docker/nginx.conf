worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # "https" when the shared Caddy (~/dockers/proxy) terminated TLS in front of us.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    server {
        listen 80;
        server_name localhost;

        # The shared Caddy reaches this server over the Docker proxy network (172.30.0.0/16),
        # so it arrives from a bridge address; take the visitor's address from the header
        # it sets. Without this every visitor through Caddy shares one IP (and one sign-in
        # rate limit).
        set_real_ip_from 172.16.0.0/12;
        real_ip_header   X-Forwarded-For;

        # Docker's internal DNS resolver. The headtilts-* aliases are this project's own
        # services: plain "api" or "web" could also match another project's container
        # on the shared proxy network.
        # Using variables in proxy_pass forces per-request DNS lookup so
        # nginx can start (and keep running) while the API container is
        # still booting or running migrations.
        resolver 127.0.0.11 valid=10s ipv6=off;

        client_max_body_size 50m;

        # Backup upload — large body, long timeout for transfer
        location = /api/backups/upload {
            set $upstream http://headtilts-api:3000;
            client_max_body_size 2g;
            proxy_pass              $upstream;
            proxy_http_version      1.1;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;
            proxy_request_buffering off;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $forwarded_proto;
        }

        # Backup restore — synchronous, includes pre-restore safety backup + mysqldump + mysql restore
        location ~ ^/api/backups/[0-9]+/restore$ {
            set $upstream http://headtilts-api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        # API
        location /api/ {
            set $upstream http://headtilts-api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        # Socket.IO - must come before the /api/ block is irrelevant but must
        # have WebSocket upgrade headers; nginx strips Upgrade by default.
        location /socket.io/ {
            set $upstream http://headtilts-api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        # Uploaded media
        location /uploads/ {
            set $upstream http://headtilts-api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        # Crawler files served by the API
        location = /robots.txt {
            set $upstream http://headtilts-api:3000;
            proxy_pass       $upstream;
            proxy_set_header Host $host;
        }

        location = /sitemap.xml {
            set $upstream http://headtilts-api:3000;
            proxy_pass       $upstream;
            proxy_set_header Host $host;
        }

        # Admin SPA
        # Redirect bare /admin so the SPA loads with a trailing slash.
        # Use $http_host (not $host) to preserve the port the browser used --
        # nginx listens on 80 internally but may be exposed on a different port.
        location = /admin {
            return 301 $forwarded_proto://$http_host/admin/;
        }

        # Strip the /admin/ prefix before forwarding to the admin container.
        # The inner nginx has try_files -> /index.html for SPA routing.
        location /admin/ {
            set $admin http://headtilts-admin:80;
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass         $admin;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # RSS feeds: /feed, /rss.xml, /categories/<slug>/feed, /tags/<slug>/feed
        location = /feed {
            set $upstream http://headtilts-api:3000;
            proxy_pass       $upstream;
            proxy_set_header Host $host;
        }

        location = /rss.xml {
            set $upstream http://headtilts-api:3000;
            proxy_pass       $upstream;
            proxy_set_header Host $host;
        }

        location ~ ^/(categories|tags)/[^/]+/feed/?$ {
            set $upstream http://headtilts-api:3000;
            proxy_pass       $upstream;
            proxy_set_header Host $host;
        }

        # Public website pages (any path without a file extension). The API
        # serves the app's index.html with each page's title, description and
        # link-preview tags filled in, so shared links and crawlers see them.
        # If the API is down or erroring, the plain app is served instead.
        location ~ ^/(?!api/|admin(?:/|$)|uploads/|socket\.io/)[^.]*$ {
            set $upstream http://headtilts-api:3000/_page$request_uri;
            proxy_pass             $upstream;
            proxy_http_version     1.1;
            proxy_set_header       Host            $host;
            proxy_set_header       X-Real-IP       $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout  3s;
            proxy_read_timeout     10s;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @web;
        }

        location @web {
            set $web http://headtilts-web:80;
            proxy_pass         $web;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Public website (static files and the fallback above)
        # The inner nginx has try_files -> /index.html for SPA routing.
        location / {
            set $web http://headtilts-web:80;
            proxy_pass         $web;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
