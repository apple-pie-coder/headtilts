# ── All services share one internal network. ──────────────────────────────────
# The ONLY port exposed to the host is nginx on HTTP_PORT (default: 80).
# Change HTTP_PORT in your .env to run on any port you choose (e.g. 8080).
#
# Quick start:
#   cp .env.example .env       # copy the template
#   nano .env                  # set your secrets and HTTP_PORT
#   docker compose up -d --build
#   docker compose exec api sh -c "cd apps/api && node_modules/.bin/prisma db seed"

# Request logs hold visitors' IP addresses; keep them small and overwritten
# (the privacy policy says access logs are rotated).
x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Mailpit (local SMTP catcher; multi-arch MailHog replacement) ────────────
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    # Bound to localhost by default — the UI/API has no auth. The api container
    # reaches it over the internal network as mailpit:1025. Set MAILPIT_BIND=0.0.0.0
    # in .env to open the UI to the LAN.
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:1025:1025"  # SMTP
      - "${MAILPIT_BIND:-127.0.0.1}:8025:8025"  # Web UI
    networks:
      - internal
  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-headtilts}
      MYSQL_USER: ${MYSQL_USER:-headtilts}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API (Express + Prisma) ───────────────────────────────────────────────────
  # Not exposed to the host — nginx proxies /api/* and /uploads/* to it.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    logging: *rotated-logs
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-headtilts}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-headtilts}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      API_PORT: 3000
      SITE_URL: ${SITE_URL:-http://localhost}
      WEB_URL: ${WEB_URL:-http://localhost}
      ADMIN_URL: ${ADMIN_URL:-http://localhost/admin}
      # Passkeys: default to ADMIN_URL's host and origin. Override when the admin
      # is reached through another hostname (RP ID = registrable domain, origins = full URLs).
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      # Extra origins allowed to call the API, e.g. the plain-HTTP LAN address when
      # ADMIN_URL points at an HTTPS gateway in front of it.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /app/apps/api/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Paid tickets. The webhook secret is the one set on the webhook in the Razorpay
      # dashboard (URL: <SITE_URL>/api/public/payments/razorpay/webhook).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Bot check on the public ticket form (Cloudflare Turnstile); off unless both are set.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Admin feedback → GitHub issues. Fine-grained token with "Issues: read & write"
      # on the repo below; leave empty to keep feedback in the admin only.
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-apple-pie-coder/headtilts}
    volumes:
      - uploads_data:/app/apps/api/uploads
      - backups_data:/app/apps/api/backups
    # nginx joins the shared proxy network too, where other projects have their own
    # "api" / "web"; it looks these services up by their headtilts-* names only.
    networks:
      internal:
        aliases: [headtilts-api]

  # ── Admin panel (React SPA → nginx) ─────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    logging: *rotated-logs
    depends_on:
      - api
    networks:
      internal:
        aliases: [headtilts-admin]

  # ── Public website (React SPA → nginx) ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    logging: *rotated-logs
    depends_on:
      - api
    networks:
      internal:
        aliases: [headtilts-web]

  # ── nginx reverse proxy ──────────────────────────────────────────────────────
  # This is the ONLY service with a host-port binding, and only on the Pi's loopback
  # (HTTP_PORT in .env; scripts on the Pi use http://localhost:HTTP_PORT). Other
  # devices come in through the shared Caddy (~/dockers/proxy), which reaches this
  # container as "headtilts" on the proxy network: https://pandorasbox.local:5444,
  # or plain http on the LAN address and HTTP_PORT.
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    logging: *rotated-logs
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - admin
      - web
    networks:
      internal:
      proxy:
        aliases: [headtilts]

volumes:
  mysql_data:
  uploads_data:
  backups_data:

networks:
  internal:
    driver: bridge
  # Shared with the proxy (made once: see ~/dockers/proxy).
  proxy:
    external: true
